name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_easy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_easy
      DATABASE_DRIVER: pg
      CONFIRM_EMAIL_SECRET: confirm-email-secret-for-e2e-only-00
      CONSENT_PSEUDONYM_KEY: ci-consent-pseudonym-key-not-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          # SHA-256 published for the v8.30.1 linux x64 archive, which contains the binary.
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "/tmp/${asset}" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${asset}"
          echo "${expected}  /tmp/${asset}" | sha256sum -c -
          sudo tar -xzf "/tmp/${asset}" -C /usr/local/bin gitleaks
          gitleaks detect --redact --no-banner --exit-code 1 --config .gitleaks.toml

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate local database
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Audit
        run: pnpm audit --audit-level high

      - name: Audit production dependencies
        run: pnpm audit --prod
