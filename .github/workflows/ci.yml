name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_easy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_easy
      CONFIRM_EMAIL_SECRET: confirm-email-secret-for-e2e-only-00
      CONSENT_PSEUDONYM_KEY: ci-consent-pseudonym-key-not-secret
      CRON_SECRET: ci-cron-secret-value-32-characters-ok
      EMAIL_TRANSPORT: resend
      RESEND_API_KEY: ci-resend-key-not-secret
      APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          # SHA-256 published for the v8.30.1 linux x64 archive, which contains the binary.
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "/tmp/${asset}" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${asset}"
          echo "${expected}  /tmp/${asset}" | sha256sum -c -
          sudo tar -xzf "/tmp/${asset}" -C /usr/local/bin gitleaks
          gitleaks detect --redact --no-banner --exit-code 1 --config .gitleaks.toml

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Create gym_easy_migrator
        run: |
          node --input-type=module <<'EOF'
          import postgres from "postgres";
          const sql = postgres("postgresql://postgres:postgres@localhost:5432/gym_easy", { max: 1 });
          await sql.unsafe(`
            DO $$
            BEGIN
              CREATE ROLE gym_easy_migrator LOGIN PASSWORD 'migrator' SUPERUSER;
            EXCEPTION
              WHEN duplicate_object THEN NULL;
            END
            $$;
          `);
          await sql.end({ timeout: 5 });
          EOF

      - name: Migrate local database
        env:
          DATABASE_URL: postgresql://gym_easy_migrator:migrator@localhost:5432/gym_easy
        run: pnpm db:migrate

      - name: Container migrate script against local Postgres
        env:
          RUN_MIGRATIONS: "true"
          DATABASE_URL_MIGRATOR: postgresql://gym_easy_migrator:migrator@localhost:5432/gym_easy
        run: node scripts/migrate-on-deploy.mjs

      - name: Wait for Mailpit
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1

      - name: Unit tests
        env:
          MAILPIT_SMTP_HOST: 127.0.0.1
          MAILPIT_SMTP_PORT: "1025"
          MAILPIT_API_URL: http://127.0.0.1:8025
        run: pnpm test

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Audit
        run: pnpm audit --audit-level high

      - name: Audit production dependencies
        run: pnpm audit --prod

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build --pull -t gym-easy:ci .

      - name: Image runs as a non-root user
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' gym-easy:ci)" = "nextjs"
          health="$(docker inspect --format '{{json .Config.Healthcheck.Test}}' gym-easy:ci)"
          [[ "${health}" == *'/api/health'* ]]
          [[ "${health}" == *node* ]]
          [[ "${health}" != *wget* ]]
          [[ "${health}" != *curl* ]]
          docker run --rm --entrypoint node gym-easy:ci --input-type=module -e "import fs from 'node:fs'; const migrate = fs.readFileSync('/app/migrate-on-deploy.mjs','utf8'); const purge = fs.readFileSync('/app/scripts/purge-consent.mjs','utf8'); if(!fs.existsSync('/app/server.js')) process.exit(1); if(!migrate.includes('migrate-on-deploy')) process.exit(3); if(!fs.existsSync('/app/migrations/meta/_journal.json')) process.exit(4); if(!purge.includes('purge-consent')) process.exit(5); if(/^\s*import\b[^\n]*\bfrom\s+['\x22](?:drizzle-orm|postgres)(?:\/|['\x22])/m.test(migrate)) process.exit(6); if(process.getuid()===0) process.exit(2);"
          skipped="$(docker run --rm --entrypoint node -e RUN_MIGRATIONS=false gym-easy:ci /app/migrate-on-deploy.mjs)"
          [[ "${skipped}" == *'migrate-on-deploy: skipped'* ]]

      - name: Bootstrap Infra roles
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            -v "${PWD}/scripts/bootstrap-ci-roles.sql:/bootstrap.sql:ro" \
            postgres:16 \
            psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f /bootstrap.sql

      - name: Migrations, startup, and health
        run: |
          set -euo pipefail
          docker rm -f gym-easy-boot >/dev/null 2>&1 || true
          docker run -d --name gym-easy-boot --network host \
            -e NODE_ENV=production \
            -e EMAIL_TRANSPORT=resend \
            -e RESEND_API_KEY=ci-resend-key-not-secret \
            -e EMAIL_FROM='Gym Easy <noreply@gaffer.pt>' \
            -e APP_URL=http://127.0.0.1:3000 \
            -e DATABASE_URL=postgresql://gym_easy_app:app@127.0.0.1:5432/gym_easy \
            -e DATABASE_URL_MIGRATOR=postgresql://gym_easy_migrator:migrator@127.0.0.1:5432/gym_easy \
            -e CONFIRM_EMAIL_SECRET=confirm-email-secret-for-e2e-only-00 \
            -e CONSENT_PSEUDONYM_KEY=ci-consent-pseudonym-key-not-secret \
            -e CRON_SECRET=ci-cron-secret-value-32-characters-ok \
            -e RUN_MIGRATIONS=true \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            gym-easy:ci
          ready=0
          for _ in $(seq 1 45); do
            if ! docker inspect --format '{{.State.Running}}' gym-easy-boot | grep -q true; then
              echo "container exited before health" >&2
              docker logs gym-easy-boot >&2 || true
              exit 1
            fi
            code="$(curl -sS -o /tmp/gym-easy-health.json -w '%{http_code}' --max-time 2 http://127.0.0.1:3000/api/health || true)"
            if [ "${code}" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready}" != "1" ]; then
            echo "health did not return 200" >&2
            docker logs gym-easy-boot >&2 || true
            exit 1
          fi
          docker logs gym-easy-boot > /tmp/gym-easy-boot.log 2>&1
          grep -q 'migrate-on-deploy: applied' /tmp/gym-easy-boot.log
          docker exec gym-easy-boot node /app/scripts/purge-consent.mjs
          docker rm -f gym-easy-boot >/dev/null
