# Mailpit accepts mail for local development and for Coolify.
# SMTP 1025 and the web UI 8025 are bound to 127.0.0.1 only.
# Do not attach a public domain or a 0.0.0.0 port to the UI.
# Reach it through the tailnet or Coolify's internal network.

services:
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - gym-easy

  app:
    profiles: ["app"]
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      [
        "sh",
        "-c",
        "corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000",
      ]
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mailpit
    networks:
      - gym-easy

networks:
  gym-easy:
