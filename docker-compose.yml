# Coolify: the app and Mailpit share gym-easy.
# Only the app is exposed. Coolify proxies that port and owns the domain.
# Mailpit SMTP 1025 and UI 8025 stay on the docker network.

services:
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - gym-easy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      DATABASE_URL: ${DATABASE_URL}
      CONFIRM_EMAIL_SECRET: ${CONFIRM_EMAIL_SECRET}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      CRON_SECRET: ${CRON_SECRET:-}
    expose:
      - "3000"
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      - gym-easy

networks:
  gym-easy:
