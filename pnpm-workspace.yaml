auditConfig:
  # CVE-2026-93687: braces <=3.0.3 can exhaust the stack on deeply nested
  # patterns. It arrives only through eslint-config-next > fast-glob >
  # micromatch, and there is no patched release. Not used in production.
  # Owner: leduardo99
  # Expires: 2026-11-13 — remove this exception or replace the dependency.
  ignoreCves:
    - CVE-2026-93687

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - esbuild

# Install the native package for this machine and both glibc Linux targets.
# Coolify builds the image on the arm64 host; CI also builds amd64.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
