auditConfig:
  # CVE-2026-93687 (braces <=3.0.3): stack exhaustion on nested globs. Only via
  # eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch.
  # Not in production (`pnpm audit --prod` is clean; shadcn CLI is dev-only).
  # Owner: leduardo99
  # Expires: 2026-11-13 — remove when eslint-config-next drops or patches braces.
  ignoreCves:
    - CVE-2026-93687

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - esbuild

# Install the native package for this machine and both glibc Linux targets.
# Coolify builds the image on the arm64 host; CI also builds amd64.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
